name: Shroom CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: ./frontend
        run: npx tsc -b

      # Backend
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          
      - name: Backend Verify
        working-directory: ./backend
        run: |
          go vet ./...
          go build -v ./...

  deploy:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      - name: Record release commit
        run: printf '%s\n' "$GITHUB_SHA" > release.sha

      - name: Copy release to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend,frontend,docker,docker-compose.prod.yml,release.sha"
          target: "/var/www/shroom/.release"
          rm: true

      - name: Build and deploy release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu

            cd /var/www/shroom/.release
            test -f /var/www/shroom/.env

            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 is required. Install docker-compose-v2 and rerun deployment." >&2
              exit 1
            fi

            echo "Deploying commit $(cat release.sha)"
            docker compose --project-name shroom --env-file /var/www/shroom/.env -f docker-compose.prod.yml build --pull
            docker compose --project-name shroom --env-file /var/www/shroom/.env -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --project-name shroom --env-file /var/www/shroom/.env -f docker-compose.prod.yml ps
