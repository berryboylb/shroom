name: Shroom CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build and Bundle Budget
        working-directory: ./frontend
        run: |
          npm run build
          npm run bundle:check

      - name: Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test:unit

      - name: Install Playwright Browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Feedback Browser Tests
        working-directory: ./frontend
        run: npm run test:e2e -- e2e/feedback.spec.ts

      # Backend
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          
      - name: Backend Verify
        working-directory: ./backend
        run: |
          go vet ./...
          go test ./...
          go build -v ./...

      - name: Check deployment script
        run: bash -n scripts/deploy-production.sh

  deploy:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: shroom-production
      cancel-in-progress: false
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      - name: Record release commit
        run: printf '%s\n' "$GITHUB_SHA" > release.sha

      - name: Copy release to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend,frontend,docker,scripts,docker-compose.prod.yml,release.sha"
          target: "/var/www/shroom/.release"
          rm: true

      - name: Build and deploy release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/shroom/.release
            bash scripts/deploy-production.sh
