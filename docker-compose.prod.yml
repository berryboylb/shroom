services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shroom
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    mem_limit: 128m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: unless-stopped
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Keep production container DNS separate from the host-oriented values in
      # the development .env file. Deployments can override these explicitly.
      - DATABASE_URL=${PROD_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/shroom?sslmode=disable}
      - REDIS_URL=${PROD_REDIS_URL:-redis://redis:6379}
      - PORT=8080
      - LIVEKIT_URL=${PROD_LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.prod.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/tcp"
      - "3478:3478/udp"
    volumes:
      - ./docker/livekit/livekit.prod.yaml:/etc/livekit.prod.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - "LIVEKIT_WEBHOOK_API_KEY=${LIVEKIT_API_KEY}"
      - "LIVEKIT_WEBHOOK_URLS=http://backend:8080/api/webhooks/livekit"
    restart: unless-stopped
    mem_limit: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
